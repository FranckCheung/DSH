- insert:
    # The managed entry list: installed MCP server rows live in mcp-servers.json
    # beside this file and are created, enabled, and removed through the plugin.
    - id: local-mcp-servers
      name: 'cordis:include'
      config:
        path: './mcp-servers.json'
        initial: []
    - id: mcp-manager
      name: '@local/mcp-manager'
      config: {}
